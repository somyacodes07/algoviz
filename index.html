    <main style="font-family: Inter, sans-serif; max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; line-height: 1.6; color: #1e293b;">
      <h1 style="font-size: 2.5rem; font-weight: 800; color: #f97316; margin-bottom: 1rem;">AlgoViz - Interactive Algorithm & Code Execution Visualizer</h1>
      <p style="font-size: 1.1rem; font-weight: 500; margin-bottom: 2rem;">
        AlgoViz is a free, interactive educational workbench that helps computer science students, programmers, and educators visualize JavaScript and C++ execution step-by-step. Step through loops, recursion, lists, and trees to watch variables, call stack frames, and console outputs update in real time.
      </p>

      <nav style="margin-bottom: 3rem; background: #f8fafc; padding: 1rem; border: 2px solid #0f172a; border-radius: 4px;">
        <h2 style="font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0;">Quick Navigation</h2>
        <ul style="list-style: none; padding: 0; display: flex; gap: 1.5rem; flex-wrap: wrap;">
          <li><a href="/" style="color: #f97316; font-weight: 700; text-decoration: none;">Home Page</a></li>
          <li><a href="/visualizer/javascript/" style="color: #f97316; font-weight: 700; text-decoration: none;">JavaScript Visualizer Editor</a></li>
          <li><a href="/visualizer/cpp/" style="color: #f97316; font-weight: 700; text-decoration: none;">C++ Wasm compiler & Visualizer</a></li>
          <li><a href="/docs/" style="color: #f97316; font-weight: 700; text-decoration: none;">Technical Documentation</a></li>
        </ul>
      </nav>

      <section style="margin-bottom: 2.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; border-bottom: 2px solid #0f172a; padding-bottom: 0.5rem;">Interactive Algorithm Visualizers Included</h2>
        <ul style="padding-left: 1.5rem; margin-top: 1rem;">
          <li style="margin-bottom: 0.8rem;">
            <strong>Tree Visualizer:</strong> Animate Binary Search Trees (BST) and custom binary trees. Watch tree node insertions and traversal (In-order, Pre-order, Post-order) recursively.
          </li>
          <li style="margin-bottom: 0.8rem;">
            <strong>Linked List Visualizer:</strong> Trace singly linked lists and doubly linked lists. Automatically highlights cycle detection using Floyd's Tortoise and Hare algorithm.
          </li>
          <li style="margin-bottom: 0.8rem;">
            <strong>Stack &amp; Queue Visualizer:</strong> Animate last-in-first-out (LIFO) stack operations and first-in-first-out (FIFO) queues with visual cell transitions.
          </li>
          <li style="margin-bottom: 0.8rem;">
            <strong>Array and Matrix Grid Visualizers:</strong> Highlight pointer trackers (like i, j, left, right, mid) moving across index columns. Animate matrix traversal paths, grid pathfinding (DFS, BFS), and matrix flood fills.
          </li>
          <li style="margin-bottom: 0.8rem;">
            <strong>Call Stack and Recursion Tracker:</strong> Demystify backtracking and deep recursion (like N-Queens, Fibonacci, Merge Sort, and Quick Sort) by inspecting active call stack frames and historical local variables.
          </li>
        </ul>
      </section>

      <section style="margin-bottom: 2.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; border-bottom: 2px solid #0f172a; padding-bottom: 0.5rem;">Key Product Features</h2>
        <ul style="padding-left: 1.5rem; margin-top: 1rem;">
          <li><strong>Step-by-step Execution Controls:</strong> Play, pause, adjust speed, and scrub the timeline to watch statement transitions.</li>
          <li><strong>Complexity Analyzer:</strong> Get live time complexity (Big-O notation) estimation, hot lines hitmaps, and operations counts.</li>
          <li><strong>In-Browser C++ Compiler:</strong> Compile C++ code locally with WebAssembly Clang, or fallback to the GCC Wandbox compilation API.</li>
          <li><strong>Variables Sparklines:</strong> Render inline SVG trendlines tracking variable value mutations.</li>
          <li><strong>Enlarged Diagram View:</strong> Open zoomable/pannable full-screen views of tree, list, and graph diagrams.</li>
        </ul>
      </section>

      <section style="margin-bottom: 2.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 700; border-bottom: 2px solid #0f172a; padding-bottom: 0.5rem;">Algorithmic Templates Library</h2>
        <p>Explore pre-built templates for quick loading:</p>
        <ul style="padding-left: 1.5rem; margin-top: 0.5rem;">
          <li><strong>Search &amp; Sort:</strong> Binary Search, Bubble Sort, Selection Sort, Insertion Sort, Merge Sort, Quick Sort</li>
          <li><strong>Dynamic Programming:</strong> Climbing Stairs, Coin Change, 0/1 Knapsack</li>
          <li><strong>Graphs:</strong> Dijkstra's Shortest Path, DFS, BFS</li>
        </ul>
