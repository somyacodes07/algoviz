        <p>
          AlgoViz (<strong>algoviz.somyacodes.in</strong>) is a free, zero-config interactive visual debugging environment. Designed specifically to strip away the mystery of data structures and algorithms, AlgoViz enables users to step through code execution line by line, inspect variable mutations, follow pointer movements, track call stack frames during recursion, and analyze Big-O time complexity in real time.
        </p>

            <p style="margin-bottom: 0;">Visualizes BST insertion, node search, and recursive traversals (In-order, Pre-order, Post-order). Dynamically renders parent-child SVG node branches.</p>
          </article>
          
          <article style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 1.25rem; border-radius: 6px;">

          </article>

            <p style="margin-bottom: 0;">Step through Last-In-First-Out (LIFO) stack pushes/pops and First-In-First-Out (FIFO) queue enqueue/dequeue operations with state transition animations.</p>
          </article>

          <article style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 1.25rem; border-radius: 6px;">
            <h3 style="font-size: 1.2rem; font-weight: 700; color: #ea580c; margin-top: 0;">Sorting Algorithms Library</h3>
            <p style="margin-bottom: 0;">Compare Quick Sort, Merge Sort, Bubble Sort, Selection Sort, and Insertion Sort with index pointer trackers (i, j, left, right, pivot) moving live.</p>

            <p style="margin-bottom: 0;">Animate Depth-First Search (DFS), Breadth-First Search (BFS), Dijkstra's shortest path, 2D matrix traversal, and flood fill algorithms.</p>
