<!doctype html>
<!--
  Source for public/og-image-v2.png (1200 x 630). The call tree is computed from a real fibonacci(6) run.
  Render with headless Chrome, then copy over the public file under a new name so link previews refresh.
-->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&family=JetBrains+Mono:wght@700&display=block" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; display: flex; font-family: Inter, sans-serif; color: #0f172a; background: #12100a; }
  .poster { position: relative; flex: none; width: 660px; height: 630px; padding: 34px 40px; background: #facc15; border-right: 4px solid #0f172a; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 36px; font-weight: 900; letter-spacing: -0.04em; }
  .brand img { width: 50px; height: 50px; }
  h1 { margin-top: 30px; font-size: 94px; font-weight: 900; line-height: 1.02; letter-spacing: -0.055em; }
  h1 span { display: block; white-space: nowrap; }
  .row { display: flex !important; align-items: center; gap: 26px; }
  .code { position: relative; display: inline-block; margin: 6px 0 12px; isolation: isolate; }
  .code b { display: inline-block; padding: 2px 22px 10px; background: #0f172a; color: #fff; font-weight: 900; transform: skewX(-6deg); }
  .code::after { content: ''; position: absolute; inset: 0; z-index: -1; background: #3b82f6; transform: translate(11px, 11px) skewX(-6deg); }
  .tag { padding: 10px 14px; background: #fff; border: 3px solid #0f172a; box-shadow: 4px 4px 0 #0f172a; font: 700 26px 'JetBrains Mono', monospace; letter-spacing: -0.02em; transform: rotate(5deg); }
  .sub { margin-top: auto; font-size: 31px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; }
  .pane { position: relative; flex: 1; background-color: #12100a; background-image: radial-gradient(rgba(148, 163, 184, 0.2) 1.5px, transparent 1.5px); background-size: 24px 24px; }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sticker { position: absolute; left: 26px; top: 28px; padding: 9px 15px; background: #facc15; border: 3px solid #0f172a; box-shadow: 4px 4px 0 #000; font: 700 25px 'JetBrains Mono', monospace; letter-spacing: -0.02em; transform: rotate(-1.5deg); }
  .url { position: absolute; left: 26px; right: 26px; bottom: 26px; padding: 10px 14px; background: #221c14; border: 3px solid #5c5038; color: #f1f5f9; font-size: 25px; font-weight: 800; letter-spacing: -0.02em; text-align: center; }
</style>
</head>
<body>
  <div class="poster">
    <div class="brand"><img src="../../public/logo.svg" alt="" />AlgoViz</div>
    <h1>
      <span>See how your</span>
      <span class="row"><span class="code"><b>code</b></span><span class="tag">JS + C++</span></span>
      <span>really works.</span>
    </h1>
    <p class="sub">Step through it line by line.</p>
  </div>
  <div class="pane">
    <svg id="tree" viewBox="0 0 536 630"></svg>
    <div class="sticker">fibonacci(6) running</div>
    <div class="url">algoviz.somyacodes.in</div>
  </div>
  <script>
    // Run the real recursion and freeze the tree partway through.
    const STOP_AT = 66;
    const nodes = [];
    let clock = 0;
    let leaf = 0;
    const fib = (n, parent, depth) => {
      const node = { n, parent, depth, enter: clock++, exit: 0, x: 0, value: 0 };
      nodes.push(node);
      clock++;
      if (n <= 1) {
        node.value = n;
        node.x = leaf++;
      } else {
        clock++;
        const id = nodes.length - 1;
        const left = fib(n - 1, id, depth + 1);
        clock++;
        const right = fib(n - 2, id, depth + 1);
        clock++;
        node.value = left + right;
        const kids = nodes.filter((c) => c.parent === id);
        node.x = (kids[0].x + kids[1].x) / 2;
      }
      node.exit = clock;
      return node.value;
    };
    fib(6, -1, 0);

    const maxDepth = Math.max(...nodes.map((n) => n.depth));
    const X = (node) => 36 + (node.x / (leaf - 1)) * 464;
    const Y = (node) => 118 + (node.depth / maxDepth) * 400;
    const current = nodes.filter((n) => n.enter <= STOP_AT && STOP_AT < n.exit).sort((a, b) => b.enter - a.enter)[0];

    const COLORS = {
      wait: ['#475569', '#f1f5f9'],
      stack: ['#f97316', '#0f172a'],
      done: ['#3b82f6', '#ffffff'],
      now: ['#facc15', '#0f172a'],
    };
    const stateOf = (n) => {
      if (STOP_AT < n.enter) return 'wait';
      if (STOP_AT >= n.exit) return 'done';
      return n === current ? 'now' : 'stack';
    };

    let edges = '';
    let boxes = '';
    nodes.forEach((n) => {
      if (n.parent >= 0) {
        const p = nodes[n.parent];
        const lit = stateOf(n) !== 'wait';
        const color = lit ? COLORS[stateOf(n)][0] : '#94a3b8';
        edges += `<line x1="${X(p)}" y1="${Y(p)}" x2="${X(n)}" y2="${Y(n)}" stroke="${color}" stroke-width="5" />`;
      }
    });
    nodes.forEach((n) => {
      const [fill, ink] = COLORS[stateOf(n)];
      const size = 33;
      const x = X(n) - size / 2;
      const y = Y(n) - size / 2;
      boxes += `<rect x="${x + 5}" y="${y + 5}" width="${size}" height="${size}" fill="#000" />`;
      boxes += `<rect x="${x}" y="${y}" width="${size}" height="${size}" fill="${fill}" stroke="#0f172a" stroke-width="2" />`;
      boxes += `<text x="${X(n)}" y="${Y(n) + 7}" fill="${ink}" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="21">${stateOf(n) === 'done' ? n.value : n.n}</text>`;
    });
    document.getElementById('tree').innerHTML = edges + boxes;
  </script>
</body>
</html>
