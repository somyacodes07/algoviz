<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .shadow { fill: #0f172a; }
    .box { fill: #ffffff; stroke: #0f172a; stroke-width: 5; stroke-linejoin: round; }
    .letters { fill: none; stroke: #0f172a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #f97316; }

    @media (prefers-color-scheme: dark) {
      .shadow { fill: #000000; }
      .box { fill: #111113; stroke: #444444; }
      .letters { stroke: #f1f5f9; }
      .dot { fill: #f97316; }
    }
  </style>

  <!-- Shadow offset -->
  <rect x="18" y="18" width="74" height="74" rx="8" class="shadow" />
  <!-- Main bounding box centered at x=50, y=50 -->
  <rect x="13" y="13" width="74" height="74" rx="8" class="box" />

  <!-- A centered and scaled inside perfectly -->
  <path d="M 21,66 L 31,34 L 41,66 M 26,53 L 36,53" class="letters" />
  <!-- V directly adjacent -->
  <path d="M 45,34 L 55,66 L 65,34" class="letters" />
  <!-- Saffron dot -->
  <circle cx="74" cy="62" r="4.5" class="dot" />
</svg>
